<title>NOCTURNE — Music Space</title>
<style>
:root{color-scheme:dark;--bg:#090910;--panel:rgba(24,24,37,.76);--panel2:#171725;--line:rgba(255,255,255,.09);--text:#f4f2fb;--muted:#9997ac;--accent:#a78bfa;--accent2:#60a5fa;--good:#a7f3d0;--danger:#fda4af;--radius:22px}

main{min-width:0;padding:25px clamp(18px,3.3vw,50px) 30px}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:32px}.mobile-brand{display:none}.searchbox{display:flex;align-items:center;gap:11px;max-width:620px;flex:1;position:relative}.searchbox svg{position:absolute;left:16px;width:18px;color:var(--muted)}.searchbox input{width:100%;background:#ffffff08;border:1px solid var(--line);border-radius:15px;padding:13px 44px;color:var(--text);outline:none;transition:.2s}.searchbox input:focus{border-color:#a78bfa77;background:#ffffff0d}.searchbox input::placeholder{color:#77758c}.search-clear{position:absolute;right:8px;background:transparent;color:var(--muted);font-size:20px;display:none}.top-actions{display:flex;gap:8px;margin-left:auto}.icon-btn{width:42px;height:42px;display:grid;place-items:center;background:#ffffff08;border:1px solid var(--line);border-radius:14px;color:#cbc8dd;transition:.2s}.icon-btn:hover{background:#ffffff13;transform:translateY(-1px)}.icon-btn svg{width:18px;height:18px}.eyebrow{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:#aaa1d7;font-weight:700}.page-title{font-size:clamp(28px,3.1vw,43px);letter-spacing:-.045em;line-height:1.1;margin:8px 0 10px;font-weight:750}.subtle{color:var(--muted)}.hero{position:relative;overflow:hidden;border:1px solid #ffffff12;border-radius:28px;min-height:275px;padding:clamp(24px,4vw,46px);display:flex;align-items:center;background:linear-gradient(110deg,#20183bdf 0%,#151c35db 52%,#102638bd 100%);box-shadow:0 25px 70px #0003}.hero:before{content:"";position:absolute;width:370px;height:370px;border-radius:50%;right:5%;top:-30%;background:radial-gradient(circle,#8b70ed44,transparent 67%);filter:blur(5px)}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:16%;bottom:-62%;background:radial-gradient(circle,#38bdf844,transparent 70%)}.hero-copy{max-width:560px;position:relative;z-index:1}.hero h2{font-size:clamp(26px,3vw,39px);line-height:1.12;letter- r:1px solid var(--line);background:#ffffff07;color:#aaa6bd;border-radius:99px;padding:7px 11px;font-size:11px}.pill.active{background:#a78bfa1b;border-color:#a78bfa66;color:#d5caff}.track-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:24px}.now-card{padding:24px;border-radius:24px;background:linear-gradient(145deg,#1b1a2b,#11131e);border:1px solid var(--line)}.now-cover{width:min(100%,330px);aspect-ratio:1;border-radius:20px;margin:0 auto 24px;box-shadow:0 20px 50px #0006;overflow:hidden;background:linear-gradient(135deg,#7961bc,#1c2444);display:grid;place-items:center;font-size:70px}.now-cover img{width:100%;height:100%;object-fit:cover}.now-meta{text-align:center}.now-meta h2{margin:0 0 5px;font-size:22px}.now-meta p{margin:0;color:var(--muted)}.now-controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:20px}.round-main{width:54px;height:54px;border-radius:50%;background:#b9a5ff;color:#151020;display:grid;place-items:center}.round-main svg{width:22px}.progress-wrap{display:flex;align-items:center;gap:10px;margin-top:24px;font-size:10px;color:var(--muted)}input[type=range]{accent-color:#b29bff;min-width:0}.progress-wrap input{flex:1}.queue-panel{padding:21px;border:1px solid var(--line);border-radius:24px;background:#ffffff05}.queue-panel h3{margin:0;font-size:16px}.queue-panel .subtle{font-size:12px;margin:5px 0 17px}.queue-list{display:grid;gap:4px}.queue-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px}.queue-item.current{background:#a78bfa13}.queue-item .cover{width:40px;flex:0 0 40px;border-radius:9px}.queue-item .result-meta strong{font-size:12px}.queue-item .result-meta span{font-size:10px}.queue-item button{background:transparent;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.setting{padding:18px;border:1px solid var(--line);background:#ffffff05;border-radius:17px;display:flex;justify-content:space-between;align-items:center;gap:15px}.setting strong{font-size:13px}.setting p{margin:4px 0 0;color:var(--muted);font-size:11px}.setting input[type=checkbox]{accent-color:#a78bfa;width:17px;height:17px}.setting input[type=range]{width:110px}.toast{position:fixed;bottom:112px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:11px 16px;border:1px solid var(--line);background:#202032f2;backdrop-filter:blur(18px);border-radius:12px;font-size:12px;box-shadow:0 12px 40px #0005;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
.playerbar{position:fixed;z-index:20;bottom:0;left:0;right:0;height:92px;padding:12px 24px;display:grid;grid-template-columns:minmax(170px,1fr) minmax(240px,1.3fr) minmax(140px,1fr);align-items:center;gap:20px;background:rgba(13,13,22,.88);backdrop-filter:blur(28px);border-top:1px solid #ffffff13}.player-track{display:flex;align-items:center;gap:12px;min-width:0}.player-track .cover{width:52px;flex:0 0 52px;border-radius:10px}.player-track h4{font-size:12px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-track p{font-size:10px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-track .like{background:transparent;color:var(--muted);margin-left:5px}.player-center{display:grid;gap:6px}.transport{display:flex;align-items:center;justify-content:center;gap:17px}.transport button{background:transparent;color:#bdb8d0;display:grid;place-items:center}.transport button:hover{color:white}.transport svg{width:17px;height:17px}.transport .play{width:34px;height:34px;border-radius:50%;background:#eee9ff;color:#161322}.transport .play svg{width:16px}.bar-progress{display:flex;align-items:center;gap:9px;color:#858198;font-size:9px}.bar-progress input{width:100%;height:3px}.player-extra{display:flex;align-items:center;justify-content:flex-end;gap:13px;color:#a8a3bb}.player-extra input{width:75px}.player-extra button{background:transparent;color:inherit}.player-extra svg{width:17px}.mobile-nav{display:none}.hidden{display:none!important}

@media(max-width:800px){.app{display:block;padding-bottom:150px}.sidebar{display:none}main{padding:17px 17px 30px}.topbar{gap:10px;margin-bottom:23px}.mobile-brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.12em}.mobile-brand .brandmark{width:30px;height:30px}.searchbox input{padding:11px 36px 11px 40px}.searchbox svg{left:13px}.top-actions .icon-btn:first-child{display:none}.hero{min-height:255px;padding:25px}.hero-art{right:-5%;width:145px;opacity:.4}.hero-copy{max-width:440px}.hero p{max-width:300px}.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.music-card{padding:6px}.music-card h3{font-size:12px}.section{margin-top:28px}.playerbar{height:126px;padding:10px 14px 30px;grid-template-columns:1fr auto;gap:4px 12px}.player-track{grid-column:1;grid-row:1}.player-track .cover{width:42px;flex-basis:42px}.player-center{grid-column:1/3;grid-row:2}.player-extra{grid-column:2;grid-row:1}.player-extra input,.player-extra .queue-shortcut{display:none}.transport{gap:22px}.bar-progress{gap:7px}.mobile-nav{display:flex;position:fixed;z-index:19;bottom:126px;left:0;right:0;justify-content:space-around;padding:8px 8px 7px;background:#0e0e18eF;border-top:1px solid var(--line);backdrop-filter:blur(20px)}.mobile-nav button{display:grid;gap:3px;justify-items:center;background:transparent;color:#8c889f;font-size:9px}.mobile-nav button.active{color:#c5b6ff}.mobile-nav svg{width:18px}.toast{bottom:140px}.track-layout{grid-template-columns:1fr}.now-cover{width:min(75%,300px)}.settings-grid{grid-template-columns:1fr}}

</style>

<body>
<div class="ambient" id="ambient"></div><div class="grain"></div>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 17V7l14-3v13"/><circle cx="3.5" cy="18" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/></svg></div><div class="brandname">NOCTURNE<small>MUSIC SPACE</small></div></div>
  <div><p class="nav-label">Пространство</p><nav class="nav" id="sideNav">
  <button class="active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-page="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>Поиск</button>
  <button data-page="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Моя коллекция <span class="count" id="likedCount">0</span></button>
  <button data-page="favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.8c0 5.1-8.8 10.2-8.8 10.2S3.2 13.9 3.2 8.8A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.5Z"/></svg>Любимые треки</button>
  <button data-page="recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Недавно слушали</button>
  <button data-page="queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/><path d="m17 16 3 2-3 2"/></svg>Очередь</button>
  </nav></div>
  <div><p class="nav-label">Приложение</p><nav class="nav"><button data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.6a8 8 0 0 1-1.5.9l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.6-1.5-2.6 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.5-2.6 1.7.6a8 8 0 0 1 1.5-.9l.3-1.8h3l.3 1.8a8 8 0 0 1 1.5.9l1.7-.6 1.5 2.6-1.4 1.1a7 7 0 0 1 0 1.7Z" transform="translate(-1 -1)"/></svg>Настройки</button></nav></div>
  <div class="sidebar-bottom"><strong>Музыка без границ</strong><p>Ищи любимое и собирай собственную библиотеку.</p><button class="small-btn" data-page="search">Найти музыку ↗</button></div>
</aside>
<main>
  <header class="topbar">
    <div class="mobile-brand"><div class="brandmark">♫</div><span class="brandname">NOCTURNE</span></div>
    <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="Треки, исполнители, альбомы…" autocomplete="off" aria-label="Поиск музыки"><button class="search-clear" id="clearSearch" aria-label="Очистить поиск">×</button></div>
    <div class="top-actions"><button class="icon-btn" id="themeQuick" aria-label="Сменить тему" title="Сменить тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9c-5 1-10-4-9-9Z"/></svg></button><button class="icon-btn" data-page="settings" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.5 7.5 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2.6-1.5L13.5 2h-3L10 5a7 7 0 0 0-2.6 1.5L5 5.5 3 9l2 1.5a7.5 7.5 0 0 0 0 3L3 15l2 3.5 2.4-1A7 7 0 0 0 10 19l.5 3h3l.5-3a7 7 0 0 0 2.6-1.5l2.4 1L21 15Z"/></svg></button></div>
  </header>
  <div id="view"></div>
</main>
</div>
<nav class="mobile-nav"><button class="active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10H14v-7H9v7H4z"/></svg>Главная</button><button data-page="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>Поиск</button><button data-page="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Коллекция</button><button data-page="queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Очередь</button></nav>
<div class="playerbar" id="playerbar">
  <div class="player-track"><div class="cover"><div class="cover-placeholder">♫</div></div><div style="min-width:0"><h4 id="barTitle">Ничего не играет</h4><p id="barArtist">Найди свою следующую любимую песню</p></div><button class="like" id="barLike" title="Добавить в любимое" aria-label="Добавить в любимое">♡</button></div>
  <div class="player-center"><div class="transport"><button id="shuffleBtn" title="Перемешать" aria-label="Перемешать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m16 3 5 0v5M4 20 21 3M21 16v5h-5M4 4l5 5M14 14l7 7"/></svg></button><button id="prevBtn" title="Предыдущий трек" aria-label="Предыдущий"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button><button class="play" id="playBtn" title="Воспроизвести" aria-label="Воспроизвести"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 12 7-12 7z"/></svg></button><button id="nextBtn" title="Следующий трек" aria-label="Следующий"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button><button id="repeatBtn" title="Повтор выключен" aria-label="Повтор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg></button></div><div class="bar-progress"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="100" value="0" aria-label="Позиция воспроизведения"><span id="duration">0:00</span></div></div>
  <div class="player-extra"><button id="volumeBtn" aria-label="Выключить звук" title="Выключить звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></button><input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Громкость"><button class="queue-shortcut" data-page="queue" title="Очередь"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><button id="expandBtn" title="Открыть экран прослушивания" aria-label="Открыть экран прослушивания"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button></div>
</div>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="none" crossorigin="anonymous"></audio>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const icons={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 12 7-12 7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',heart:'♡',heartOn:'♥',plus:'+',external:'↗'};
const audio=$('#audio'), view=$('#view');
const Store={get(k,f){try{return JSON.parse(localStorage.getItem('nocturne:'+k))??f}catch{return f}},set(k,v){try{localStorage.setItem('nocturne:'+k,JSON.stringify(v))}catch{}}};
const state={page:'home',query:'',results:null,searching:false,liked:Store.get('liked',[]),recent:Store.get('recent',[]),queue:Store.get('queue',[]),current:Store.get('current',null),isPlaying:false,repeat:Store.get('repeat',0),shuffle:Store.get('shuffle',false),volume:Store.get('volume',.8),theme:Store.get('theme','dark'),intensity:Store.get('intensity',.6),reduced:Store.get('reduced',false),crossfade:Store.get('crossfade',false),crossfadeSeconds:Store.get('crossfadeSeconds',5),providerUrl:Store.get('providerUrl',''),sleepMinutes:0};
let searchTimer=null, searchController=null, toastTimer=null, sleepTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function fmt(n){if(!Number.isFinite(n)||n<0)return'0:00';n=Math.floor(n);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function persist(){Store.set('liked',state.liked);Store.set('recent',state.recent);Store.set('queue',state.queue);Store.set('current',state.current);Store.set('repeat',state.repeat);Store.set('shuffle',state.shuffle);Store.set('volume',state.volume);Store.set('theme',state.theme);Store.set('intensity',state.intensity);Store.set('reduced',state.reduced);Store.set('crossfade',state.crossfade);Store.set('crossfadeSeconds',state.crossfadeSeconds);Store.set('providerUrl',state.providerUrl)}
function coverHTML(t,size=''){return `<div class="cover ${size}">${t?.cover?`<img loading="lazy" src="${esc(t.cover)}" alt="">`:`<div class="cover-placeholder">♫</div>`}</div>`}
function trackCard(t){return `<article class="music-card" data-track="${esc(t.id)}"><div class="cover">${t.cover?`<img loading="lazy" src="${esc(t.cover)}" alt="">`:'<div class="cover-placeholder">♫</div>'}<button class="cover-play" data-play="${esc(t.id)}" aria-label="Воспроизвести">${icons.play}</button></div><h3 title="${esc(t.title)}">${esc(t.title)}</h3><p>${esc(t.artist||'Неизвестный исполнитель')}</p></article>`}
function trackRow(t,opts={}){return `<div class="result-row" data-track="${esc(t.id)}">${coverHTML(t)}<div class="result-meta"><strong>${esc(t.title)}</strong><span>${esc(t.artist||'Неизвестный исполнитель')}${t.album?' · '+esc(t.album):''}</span></div><div class="result-actions"><button data-like="${esc(t.id)}" title="В избранное">${state.liked.some(x=>x.id===t.id)?'♥':'♡'}</button>${opts.remove?`<button data-remove="${esc(t.id)}" title="Убрать">×</button>`:`<button data-add="${esc(t.id)}" title="В очередь">＋</button>`}<button data-open="${esc(t.id)}" title="Открыть источник">↗</button></div></div>`}
function heading(eyebrow,title,sub=''){return `<div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1>${sub?`<p class="subtle" style="margin-top:-3px;margin-bottom:25px">${sub}</p>`:''}`}
function empty(icon,title,desc,action=''){return `<div class="empty-state"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${desc}</p>${action}</div>`}
function setPage(p){state.page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();if(p==='search')$('#searchInput').focus({preventScroll:true});}
function navButtons(){ $$('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));}
function renderHome(){const recent=state.recent.slice(0,5);return `<section class="hero"><div class="hero-copy"><div class="eyebrow">ТВОЁ МУЗЫКАЛЬНОЕ ПРОСТРАНСТВО</div><h2>Найди звук,<br>который <span style="color:#b7a4ff">твой.</span></h2><p>Открой любимые треки, исследуй артистов и собери личную коллекцию в своём ритме.</p><button class="primary-btn" data-page="search">${icons.play} Исследовать музыку</button></div><div class="hero-art" aria-hidden="true"><span>♫</span></div></section>
<div class="status"><strong>Источник музыки ещё не подключён</strong>Поиск и воспроизведение реального каталога требуют доступного API/сервера или официального плеера. Настрой подключение в разделе «Настройки» — приложение не подменяет каталог выдуманными треками.</div>
<section class="section"><div class="section-head"><div><h2>Продолжить прослушивание</h2><p>Твои недавно открытые композиции</p></div><button class="text-btn" data-page="recent">Вся история ↗</button></div>${recent.length?`<div class="cards">${recent.map(trackCard).join('')}</div>`:empty('◷','Здесь появится твоя история','Когда откроешь доступный трек и начнёшь слушать, он появится здесь.','<button class="small-btn" data-page="search">Перейти к поиску</button>')}</section>
<section class="section"><div class="section-head"><div><h2>Твоя коллекция</h2><p>Всё, что хочется сохранить</p></div><button class="text-btn" data-page="collection">Открыть коллекцию ↗</button></div>${state.liked.length?`<div class="cards">${state.liked.slice(0,5).map(trackCard).join('')}</div>`:empty('♡','Сохраняй то, что нравится','Добавляй композиции в любимое — они останутся в этой коллекции на устройстве.')}</section>`}
function renderSearch(){let r=state.results;return `${heading('ПОИСК','Найди свою музыку','Ищи треки, исполнителей, альбомы и плейлисты в подключённом источнике.')}${!state.providerUrl?empty('⌕','Подключи музыкальный источник','В настройках можно указать URL совместимого API-сервера. Пока он не подключён, открой официальный поиск Яндекс Музыки.','<button class="primary-btn" id="openYandexSearch">Искать в Яндекс Музыке ↗</button> <button class="small-btn" data-page="settings">Настроить источник</button>'):''}${state.searching?'<div class="empty-state"><div class="empty-icon">◌</div><h3>Ищем музыку…</h3><p>Получаем результаты из подключённого источника.</p></div>':''}${r&&!state.searching?(r.error?`<div class="status"><strong>Не удалось выполнить поиск</strong>${esc(r.error)}</div>`:(r.tracks?.length||r.artists?.length||r.albums?.length||r.playlists?.length)?`${r.tracks?.length?`<section class="section"><div class="section-head"><h2>Треки</h2><span class="pill">${r.tracks.length}</span></div><div class="results-list">${r.tracks.map(t=>trackRow(t)).join('')}</div></section>`:''}${r.artists?.length?`<section class="section"><div class="section-head"><h2>Исполнители</h2></div><div class="cards">${r.artists.map(a=>`<article class="music-card" data-artist="${esc(a.id)}"><div class="cover">${a.cover?`<img loading="lazy" src="${esc(a.cover)}" alt="">`:'<div class="cover-placeholder">♙</div>'}</div><h3>${esc(a.name)}</h3><p>Исполнитель</p></article>`).join('')}</div></section>`:''}${r.albums?.length?`<section class="section"><div class="section-head"><h2>Альбомы</h2></div><div class="cards">${r.albums.map(a=>`<article class="music-card" data-album="${esc(a.id)}"><div class="cover">${a.cover?`<img loading="lazy" src="${esc(a.cover)}" alt="">`:'<div class="cover-placeholder">▧</div>'}</div><h3>${esc(a.title)}</h3><p>${esc(a.artist||'')}</p></article>`).join('')}</div></section>`:''}${r.playlists?.length?`<section class="section"><div class="section-head"><h2>Плейлисты</h2></div><div class="results-list">${r.playlists.map(p=>`<div class="result-row"><div class="cover"><div class="cover-placeholder">♫</div></div><div class="result-meta"><strong>${esc(p.title)}</strong><span>${esc(p.owner||'Плейлист')}</span></div><button class="icon-btn" data-open-url="${esc(p.url||'')}">↗</button></div>`).join('')}</div></section>`:''}`:empty('⌕','Ничего не найдено','Попробуй изменить запрос или проверь, поддерживает ли источник эту категорию.')):''}`}
function renderCollection(){return `${heading('ТВОЯ БИБЛИОТЕКА','Моя коллекция','Локально сохранённые композиции и история на этом устройстве.')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px"><button class="pill active" data-collection-tab="liked">Любимые · ${state.liked.length}</button><button class="pill" data-collection-tab="recent">Недавно слушали · ${state.recent.length}</button><button class="pill" data-collection-tab="queue">Очередь · ${state.queue.length}</button></div><div id="collectionItems">${state.liked.length?`<div class="results-list">${state.liked.map(t=>trackRow(t,{remove:true})).join('')}</div>`:empty('♡','Пока пусто','Нажимай на сердечко рядом с композицией, чтобы сохранить её здесь.')}</div>`}
function renderQueue(){return `${heading('СЛЕДУЮЩИЕ','Очередь воспроизведения','Управляй порядком локально сохранённых треков.')}<div style="display:flex;gap:8px;margin-bottom:17px"><button class="pill ${state.shuffle?'active':''}" id="queueShuffle">⇄ Перемешать</button><button class="pill" id="clearQueue">Очистить очередь</button></div>${state.queue.length?`<div class="results-list">${state.queue.map((t,i)=>`<div class="result-row"><span style="width:20px;color:var(--muted);font-size:11px">${i+1}</span>${coverHTML(t)}<div class="result-meta"><strong>${esc(t.title)}</strong><span>${esc(t.artist||'')}</span></div><div class="result-actions"><button data-play="${esc(t.id)}" title="Играть">▶</button><button data-remove="${esc(t.id)}" title="Убрать">×</button></div></div>`).join('')}</div>`:empty('☷','Очередь пуста','Добавляй треки из результатов поиска. Для воспроизведения источник должен предоставлять доступный аудио-плеер.')}`}
function renderSettings(){return `${heading('ПЕРСОНАЛИЗАЦИЯ','Настройки','Управляй видом приложения и подключением источника.')}<div class="settings-grid">
<div class="setting"><div><strong>Анимированный фон</strong><p>Мягкие световые пятна и глубина</p></div><input id="animationToggle" type="checkbox" ${!state.reduced?'checked':''}></div>
<div class="setting"><div><strong>Интенсивность анимации</strong><p>От спокойной до выразительной</p></div><input id="intensityRange" type="range" min="0" max="1" step=".1" value="${state.intensity}"></div>
<div class="setting"><div><strong>Уменьшить движение</strong><p>Для комфортного восприятия</p></div><input id="reducedToggle" type="checkbox" ${state.reduced?'checked':''}></div>
<div class="setting"><div><strong>Crossfade</strong><p>Недоступен без контроля двух аудиопотоков</p></div><input type="checkbox" disabled title="Нужен источник с поддержкой управляемого аудио"></div>
<div class="setting"><div><strong>Тема</strong><p>Сейчас: ${state.theme==='dark'?'тёмная':'светлая'}</p></div><button class="small-btn" id="themeToggle">Сменить</button></div>
<div class="setting"><div><strong>Таймер сна</strong><p>Остановить встроенное аудио через время</p></div><select id="sleepSelect" class="pill"><option value="0">Выключен</option><option value="15">15 минут</option><option value="30">30 минут</option><option value="45">45 минут</option><option value="60">60 минут</option></select></div>
</div>
<section class="section"><div class="section-head"><div><h2>Подключение каталога</h2><p>Совместимый API-адаптер должен возвращать нормализованные JSON-данные.</p></div></div><div class="queue-panel"><label for="providerUrl" style="display:block;font-size:13px;font-weight:700;margin-bottom:7px">URL API-сервера</label><input id="providerUrl" value="${esc(state.providerUrl)}" placeholder="https://your-server.example/api" style="width:100%;background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text)"><p class="subtle" style="font-size:12px">Ожидается endpoint <code>/search?q=...</code>. Ответ: <code>{ tracks:[], artists:[], albums:[], playlists:[] }</code>. Трек: <code>{id,title,artist,album,cover,duration,url,sourceUrl}</code>. Для воспроизведения в <code>url</code> должна быть разрешённая прямая аудиоссылка либо адаптер должен предоставлять официальный встроенный плеер. Не вставляй секреты или приватные токены сюда.</p><button class="primary-btn" id="saveProvider" style="margin-top:8px">Сохранить источник</button></div></section>
<div class="status" style="margin-top:18px"><strong>Важное ограничение интеграции</strong>Один статический HTML не получает автоматически доступ ко всему каталогу, аккаунту или аудиопотокам Яндекс Музыки. Публичный браузерный API для полного каталога и универсального воспроизведения нельзя предполагать. Нужен разрешённый официальный сценарий/серверный адаптер; неофициальные API могут ломаться и иметь правовые ограничения.</div>`}
function renderNowPlaying(){const t=state.current;return `${heading('NOW PLAYING','Экран прослушивания','Текущий трек и очередь.')}<div class="track-layout"><div class="now-card"><div class="now-cover">${t?.cover?`<img src="${esc(t.cover)}" alt="">`:'♫'}</div><div class="now-meta"><h2>${esc(t?.title||'Ничего не выбрано')}</h2><p>${esc(t?.artist||'Найди трек в поиске')}</p></div><div class="now-controls"><button class="icon-btn" id="nowPrev">◀</button><button class="round-main" id="nowPlay">${state.isPlaying?icons.pause:icons.play}</button><button class="icon-btn" id="nowNext">▶</button><button class="icon-btn" id="nowLike">${t&&state.liked.some(x=>x.id===t.id)?'♥':'♡'}</button></div><div class="progress-wrap"><span id="nowElapsed">0:00</span><input id="nowProgress" type="range" min="0" max="100" value="0"><span id="nowDuration">0:00</span></div></div><div class="queue-panel"><h3>Далее в очереди</h3><p class="subtle">Следующие композиции</p>${state.queue.length?`<div class="queue-list">${state.queue.slice(0,8).map(t=>`<div class="queue-item">${coverHTML(t)}<div class="result-meta"><strong>${esc(t.title)}</strong><span>${esc(t.artist||'')}</span></div></div>`).join('')}</div>`:'<p class="subtle">Очередь пока пуста.</p>'}</div></div>`}
function render(){navButtons();$('#likedCount').textContent=state.liked.length;view.innerHTML=state.page==='home'?renderHome():state.page==='search'?renderSearch():state.page==='collection'||state.page==='favorites'?renderCollection():state.page==='recent'?`${heading('ИСТОРИЯ','Недавно слушали','Последние открытые композиции.')} ${state.recent.length?`<div class="results-list">${state.recent.map(t=>trackRow(t)).join('')}</div>`:empty('◷','История пока пуста','Когда появятся открытые композиции, они будут здесь.')}`:state.page==='queue'?renderQueue():state.page==='settings'?renderSettings():state.page==='now'?renderNowPlaying():renderHome();wireView();updatePlayer()}
function wireView(){ $$('[data-page]',view).forEach(b=>b.onclick=()=>setPage(b.dataset.page));
if($('#openYandexSearch'))$('#openYandexSearch').onclick=()=>{const q=$('#searchInput').value.trim();window.open('https://music.yandex.ru/search?text='+encodeURIComponent(q),'_blank','noopener')};
$$('[data-track]',view).forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('button'))return;const t=findTrack(el.dataset.track);if(t)playTrack(t)}));
$$('[data-play]',view).forEach(b=>b.onclick=e=>{e.stopPropagation();const t=findTrack(b.dataset.play);if(t)playTrack(t)});
$$('[data-like]',view).forEach(b=>b.onclick=e=>{e.stopPropagation();toggleLike(findTrack(b.dataset.like))});
$$('[data-add]',view).forEach(b=>b.onclick=e=>{e.stopPropagation();addQueue(findTrack(b.dataset.add))});
$$('[data-remove]',view).forEach(b=>b.onclick=e=>{e.stopPropagation();state.queue=state.queue.filter(t=>t.id!==b.dataset.remove);state.liked=state.liked.filter(t=>t.id!==b.dataset.remove);persist();render();toast('Удалено')});
$$('[data-open]',view).forEach(b=>b.onclick=e=>{e.stopPropagation();const t=findTrack(b.dataset.open);if(t?.sourceUrl)window.open(t.sourceUrl,'_blank','noopener');else toast('У этого результата нет ссылки на источник')});
$$('[data-open-url]',view).forEach(b=>b.onclick=()=>b.dataset.openUrl&&window.open(b.dataset.openUrl,'_blank','noopener'));
$$('[data-artist]',view).forEach(b=>b.onclick=()=>{const a=(state.results?.artists||[]).find(x=>String(x.id)===String(b.dataset.artist));if(a?.url)window.open(a.url,'_blank','noopener');else toast('Для страницы исполнителя источник не вернул ссылку. Открой его в Яндекс Музыке через поиск.')});
$$('[data-album]',view).forEach(b=>b.onclick=()=>{const a=(state.results?.albums||[]).find(x=>String(x.id)===String(b.dataset.album));if(a?.url)window.open(a.url,'_blank','noopener');else toast('Для страницы альбома источник не вернул ссылку.')});
$$('[data-collection-tab]').forEach(b=>b.onclick=()=>{const type=b.dataset.collectionTab;$('#collectionItems').innerHTML=(type==='liked'?state.liked:type==='recent'?state.recent:state.queue).length?`<div class="results-list">${(type==='liked'?state.liked:type==='recent'?state.recent:state.queue).map(t=>trackRow(t,{remove:type!=='recent'})).join('')}</div>`:empty('♫','Пока пусто','Здесь появятся сохранённые композиции.');$$('[data-collection-tab]').forEach(x=>x.classList.toggle('active',x===b))});
if($('#queueShuffle'))$('#queueShuffle').onclick=()=>{state.shuffle=!state.shuffle;if(state.shuffle)state.queue.sort(()=>Math.random()-.5);persist();render()};
if($('#clearQueue'))$('#clearQueue').onclick=()=>{state.queue=[];persist();render();toast('Очередь очищена')};
if($('#animationToggle'))$('#animationToggle').onchange=e=>{state.reduced=!e.target.checked;applyTheme();persist()};
if($('#reducedToggle'))$('#reducedToggle').onchange=e=>{state.reduced=e.target.checked;applyTheme();persist();render()};
if($('#intensityRange'))$('#intensityRange').oninput=e=>{state.intensity=+e.target.value;applyTheme();persist()};
if($('#themeToggle'))$('#themeToggle').onclick=toggleTheme;
if($('#providerUrl'))$('#saveProvider').onclick=()=>{state.providerUrl=$('#providerUrl').value.trim().replace(/\/$/,'');persist();toast(state.providerUrl?'Источник сохранён':'Источник отключён');render()};
if($('#sleepSelect'))$('#sleepSelect').onchange=e=>setSleep(+e.target.value);
if($('#nowPlay'))$('#nowPlay').onclick=togglePlayback;
if($('#nowPrev'))$('#nowPrev').onclick=prevTrack;if($('#nowNext'))$('#nowNext').onclick=nextTrack;
if($('#nowLike'))$('#nowLike').onclick=()=>toggleLike(state.current);
if($('#nowProgress'))$('#nowProgress').oninput=e=>seek(+e.target.value);
}
function findTrack(id){return [...state.queue,...state.liked,...state.recent,state.current].filter(Boolean).find(t=>String(t.id)===String(id))||(state.results?.tracks||[]).find(t=>String(t.id)===String(id))}
function addQueue(t){if(!t)return;if(!state.queue.some(x=>x.id===t.id))state.queue.push(t);persist();toast('Добавлено в очередь');if(state.page==='queue')render()}
function toggleLike(t){if(!t)return toast('Сначала выбери трек');const i=state.liked.findIndex(x=>x.id===t.id);if(i>=0){state.liked.splice(i,1);toast('Убрано из любимого')}else{state.liked.unshift(t);toast('Добавлено в любимое')}persist();updatePlayer();if(['collection','favorites'].includes(state.page))render();else $('#likedCount').textContent=state.liked.length}
function updatePlayer(){const t=state.current;$('#barTitle').textContent=t?.title||'Ничего не играет';$('#barArtist').textContent=t?.artist||(t?'Источник не подключён':'Найди свою следующую любимую песню');const img=t?.cover?`<img src="${esc(t.cover)}" alt="">`:'<div class="cover-placeholder">♫</div>';$('.player-track .cover').innerHTML=img;$('#barLike').textContent=t&&state.liked.some(x=>x.id===t.id)?'♥':'♡';$('#barLike').style.color=t&&state.liked.some(x=>x.id===t.id)?'#c2aaff':'';$('#playBtn').innerHTML=state.isPlaying?icons.pause:icons.play;$('#playBtn').setAttribute('aria-label',state.isPlaying?'Пауза':'Воспроизвести');$('#shuffleBtn').style.color=state.shuffle?'#bba8ff':'';$('#repeatBtn').style.color=state.repeat?'#bba8ff':'';$('#repeatBtn').title=['Повтор выключен','Повтор очереди','Повтор трека'][state.repeat];$('#volume').value=state.volume;$('#ambient').style.opacity=state.reduced?'0':String(.18+state.intensity*.55);$('#ambient').style.animationDuration=state.isPlaying?'14s':'28s'}
function addRecent(t){state.recent=[t,...state.recent.filter(x=>x.id!==t.id)].slice(0,30);persist()}
async function playTrack(t){if(!t)return;state.current=t;addRecent(t);if(t.url){audio.src=t.url;audio.volume=state.volume;try{await audio.play();state.isPlaying=true;toast('Воспроизведение запущено')}catch(e){state.isPlaying=false;toast('Браузер не смог воспроизвести этот источник')} }else{state.isPlaying=false;toast(t.sourceUrl?'Открой композицию в исходном сервисе ↗':'Для этого трека нет доступного аудиоисточника');if(t.sourceUrl)window.open(t.sourceUrl,'_blank','noopener')}persist();updatePlayer();if(state.page==='now')render()}
function togglePlayback(){if(!state.current){toast('Сначала найди и выбери трек');setPage('search');return}if(!state.current.url){toast('Для этого трека нет встроенного аудио. Открой источник.');if(state.current.sourceUrl)window.open(state.current.sourceUrl,'_blank','noopener');return}if(audio.paused)audio.play().then(()=>{state.isPlaying=true;updatePlayer();persist()}).catch(()=>toast('Не удалось начать воспроизведение'));else{audio.pause();state.isPlaying=false;updatePlayer();persist()}}
function nextTrack(){if(state.repeat===2&&state.current){audio.currentTime=0;togglePlayback();return}if(!state.queue.length){state.isPlaying=false;updatePlayer();toast('Очередь пуста');return}let t=state.queue.shift();if(state.shuffle&&state.queue.length){const j=Math.floor(Math.random()*(state.queue.length+1));state.queue.splice(j,0,t);t=state.queue.shift()}persist();playTrack(t);if(state.page==='queue')render()}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return}if(state.recent.length>1){const prev=state.recent[1];if(prev)playTrack(prev)}else toast('Нет предыдущего трека')}
function seek(v){if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*v/100}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();persist();if(state.page==='settings')render()}
function applyTheme(){if(state.theme==='light'){document.documentElement.style.setProperty('--bg','#f2f0f8');document.documentElement.style.setProperty('--text','#211e31');document.documentElement.style.setProperty('--muted','#716d82');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.colorScheme='light';document.body.style.background='var(--bg)';document.querySelector('.sidebar')?.style.setProperty('background','rgba(245,243,251,.82)');document.querySelector('.playerbar')?.style.setProperty('background','rgba(248,247,252,.92)')}else{['--bg','#090910','--text','#f4f2fb','--muted','#9997ac'].reduce((_,x,i,a)=>{if(i%2===0)document.documentElement.style.setProperty(a[i],a[i+1]);return 0},0);document.documentElement.style.colorScheme='dark';document.body.style.background='var(--bg)';document.querySelector('.sidebar')?.style.setProperty('background','rgba(9,9,16,.52)');document.querySelector('.playerbar')?.style.setProperty('background','rgba(13,13,22,.88)')}$('#ambient').style.opacity=state.reduced?'0':String(.18+state.intensity*.55)}
function setSleep(minutes){clearTimeout(sleepTimer);state.sleepMinutes=minutes;if(minutes){sleepTimer=setTimeout(()=>{audio.pause();state.isPlaying=false;updatePlayer();toast('Таймер сна: воспроизведение остановлено')},minutes*60000);toast(`Таймер сна установлен на ${minutes} мин.`)}}
async function search(q){if(!state.providerUrl){state.results=null;state.searching=false;render();return}if(!q.trim()){state.results=null;state.searching=false;render();return}if(searchController)searchController.abort();searchController=new AbortController();state.searching=true;render();try{const u=new URL(state.providerUrl+'/search');u.searchParams.set('q',q.trim());const res=await fetch(u,{signal:searchController.signal,headers:{Accept:'application/json'}});if(!res.ok)throw new Error(`Сервер ответил ${res.status}`);const data=await res.json();const norm=t=>({id:String(t.id??t.trackId??''),title:t.title??t.name??'Без названия',artist:t.artist??t.artists?.map(a=>a.name).join(', ')??'',album:t.album??t.albums?.[0]?.title??'',cover:t.cover??t.coverUrl??'',duration:Number(t.duration)||0,url:t.url??t.audioUrl??'',sourceUrl:t.sourceUrl??t.externalUrl??''});state.results={tracks:(data.tracks||[]).map(norm).filter(t=>t.id&&t.title),artists:(data.artists||[]).map(a=>({id:String(a.id),name:a.name||a.title,cover:a.cover||a.coverUrl||'',url:a.url||''})),albums:(data.albums||[]).map(a=>({id:String(a.id),title:a.title||a.name,artist:a.artist||'',cover:a.cover||a.coverUrl||'',url:a.url||''})),playlists:data.playlists||[]};}catch(e){if(e.name!=='AbortError')state.results={error:e.message||'Ошибка сети'};}finally{state.searching=false;render()}}
function updateProgress(){const d=audio.duration||0,c=audio.currentTime||0;$('#elapsed').textContent=fmt(c);$('#duration').textContent=fmt(d);$('#progress').value=d?c/d*100:0;if($('#nowElapsed')){$('#nowElapsed').textContent=fmt(c);$('#nowDuration').textContent=fmt(d);$('#nowProgress').value=d?c/d*100:0}}
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value;$('#clearSearch').style.display=state.query?'block':'none';if(state.page!=='search')setPage('search');clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(state.query),320)});
$('#clearSearch').onclick=()=>{$('#searchInput').value='';state.query='';state.results=null;$('#clearSearch').style.display='none';if(state.page!=='search')setPage('search');else render()};
$('#playBtn').onclick=togglePlayback;$('#nextBtn').onclick=nextTrack;$('#prevBtn').onclick=prevTrack;$('#barLike').onclick=()=>toggleLike(state.current);$('#shuffleBtn').onclick=()=>{state.shuffle=!state.shuffle;if(state.shuffle)state.queue.sort(()=>Math.random()-.5);persist();updatePlayer();toast(state.shuffle?'Перемешивание включено':'Перемешивание выключено')};$('#repeatBtn').onclick=()=>{state.repeat=(state.repeat+1)%3;persist();updatePlayer()};
$('#volume').oninput=e=>{state.volume=+e.target.value;audio.volume=state.volume;persist()};$('#volumeBtn').onclick=()=>{audio.muted=!audio.muted;$('#volumeBtn').style.color=audio.muted?'#bba8ff':'';toast(audio.muted?'Звук выключен':'Звук включён')};$('#progress').oninput=e=>seek(+e.target.value);$('#expandBtn').onclick=()=>setPage('now');$('#themeQuick').onclick=toggleTheme;
audio.addEventListener('play',()=>{state.isPlaying=true;updatePlayer()});audio.addEventListener('pause',()=>{state.isPlaying=false;updatePlayer()});audio.addEventListener('timeupdate',updateProgress);audio.addEventListener('loadedmetadata',updateProgress);audio.addEventListener('ended',()=>{if(state.repeat===2){audio.currentTime=0;audio.play().catch(()=>{});return}if(state.queue.length||state.repeat===1)nextTrack();else{state.isPlaying=false;updatePlayer()}});audio.addEventListener('error',()=>{state.isPlaying=false;updatePlayer();toast('Ошибка аудиоисточника. Проверь URL и разрешения CORS.')});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(e.code==='Space'){e.preventDefault();togglePlayback()}else if(e.key==='ArrowLeft'){if(Number.isFinite(audio.duration))audio.currentTime=Math.max(0,audio.currentTime-5)}else if(e.key==='ArrowRight'){if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+5)}});
applyTheme();audio.volume=state.volume;render();if(state.current){$('#barTitle').textContent=state.current.title;$('#barArtist').textContent=state.current.artist||'';$('.player-track .cover').innerHTML=state.current.cover?`<img src="${esc(state.current.cover)}" alt="">`:'<div class="cover-placeholder">♫</div>'}
</script>
</body>
